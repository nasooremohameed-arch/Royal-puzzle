<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#140d33">
<title>ذهب مروي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#f2b632;--hi:#fff0a0;--lo:#9a620d;--sand:#f3dfb0;--ink:#2b1706}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#050312}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#stage{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;color:var(--sand);font-family:Cairo,system-ui,sans-serif;font-weight:600;font-size:16px;background:linear-gradient(#140d33,#3b2380 55%,#8b2f7a)}
@media(orientation:portrait){#stage{width:100vh;width:100dvh;height:100vw;left:100%;transform-origin:top left;transform:rotate(90deg)}}
#stage[data-s=city]{background:linear-gradient(#5db6f0,#bfe6ff 60%,#fff2d0)}
#stage[data-s=game]{background:linear-gradient(#26184f,#6a2a78 60%,#c25a3a)}
#bg{position:absolute;inset:0;width:100%;height:100%}#stage[data-s=game] #bg,#stage[data-s=city] #bg{display:none}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em}
.sc{position:absolute;inset:0;display:none;padding:1.2rem 2.4rem}.sc.on{display:flex}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.7rem 1.6rem;border-radius:1rem;font-weight:800;font-size:1.5rem;color:var(--ink);background:linear-gradient(#fff0a0,var(--gold) 55%,#d58f17);border:.15rem solid #fff6c0;box-shadow:0 .35rem 0 var(--lo),0 .7rem 1.2rem #0006}
.btn.s{padding:.35rem .9rem;font-size:1.15rem;box-shadow:0 .22rem 0 var(--lo)}.btn.g{color:var(--sand);background:#ffffff1c;border:.1rem solid #ffffff55;box-shadow:none}
.btn.t{background:linear-gradient(#8ff0d6,#13917f);border-color:#d8fff4;color:#fff;box-shadow:0 .35rem 0 #0a5b50,0 .7rem 1.2rem #0006}.btn.p{background:linear-gradient(#c9a0ff,#6a2fc0);border-color:#ecdcff;color:#fff;box-shadow:0 .35rem 0 #3a1580,0 .7rem 1.2rem #0006}
.btn:active{transform:translateY(.25rem)}
#hud{position:absolute;top:.8rem;left:1.2rem;z-index:20;display:none;gap:.5rem}#stage[data-s=menu] #hud,#stage[data-s=city] #hud,#stage[data-s=shop] #hud{display:flex}
.pill{display:flex;align-items:center;gap:.4rem;padding:.25rem .8rem;border-radius:99px;background:#0c0824e0;border:.1rem solid var(--lo);font-weight:800;font-size:1.2rem;color:var(--hi)}
.logo{font-family:"Reem Kufi";font-weight:700;line-height:1;background:linear-gradient(#fff6c0,var(--gold) 50%,#b8760f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .2rem 0 #4a2a05)}
#splash{flex-direction:column;align-items:center;justify-content:center;text-align:center}
.bar{width:26rem;height:1.3rem;border-radius:99px;background:#0008;border:.15rem solid var(--gold);overflow:hidden;margin-top:1.4rem}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6df0a8,#e8ff8a)}
.blink{animation:bl 1s infinite alternate}@keyframes bl{to{opacity:.35}}
#menu{align-items:center;justify-content:space-between;gap:2rem}
.prof{width:14rem;padding:1rem;border-radius:1.2rem;background:#0c0824c0;border:.12rem solid #ffffff30;text-align:center;font-size:1.05rem}
.av{width:4.4rem;height:4.4rem;margin:0 auto .4rem;border-radius:50%;display:grid;place-items:center;font-family:"Reem Kufi";font-size:2.4rem;color:var(--ink);background:linear-gradient(#fff0a0,var(--gold));border:.2rem solid #fff}
.mid{text-align:center;flex:1}.mid .logo{font-size:5.4rem}.en{letter-spacing:.6rem;font-size:1rem;color:#d9c8ff;margin:.2rem 0 1.2rem}
.row{display:flex;gap:1rem;justify-content:center;margin-top:1.2rem}.badge{background:#ff5a5f;border:.1rem solid #fff;border-radius:99px;padding:0 .5rem;font-size:.95rem;color:#fff}
.side{display:flex;flex-direction:column;gap:.8rem;width:14rem}.side .btn{width:100%}
.gem{position:absolute;width:3.4rem;height:3.4rem;animation:fl 5s ease-in-out infinite alternate;opacity:.85;filter:drop-shadow(0 .3rem .4rem #0007);pointer-events:none}@keyframes fl{to{transform:translateY(-1.4rem) rotate(12deg)}}
#game{align-items:stretch;gap:1rem;padding:1rem 1.6rem}
.info{width:10rem;display:flex;flex-direction:column;gap:.8rem}
.box{padding:.7rem;border-radius:1rem;background:#0c0824c4;border:.12rem solid var(--lo);text-align:center;font-size:1rem}.box b{display:block;font-size:2.2rem;color:var(--hi);line-height:1.1}
.combo{align-self:center;width:6.4rem;height:6.4rem;border-radius:50%;display:grid;place-items:center;text-align:center;font-size:.9rem;line-height:1;background:radial-gradient(#5b3606,#2b1706);border:.3rem solid var(--gold)}.combo b{display:block;font-size:1.9rem}.combo.on{animation:pl .5s infinite alternate}@keyframes pl{to{transform:scale(1.1);box-shadow:0 0 1.4rem var(--gold)}}
.tray{width:4.6rem;display:grid;grid-template-rows:repeat(7,1fr);gap:.3rem;padding:.4rem;border-radius:1rem;background:linear-gradient(#2a1b6b,#150f3a);border:.2rem solid var(--gold);box-shadow:0 .3rem 0 #5b3606}
.sl{border-radius:.5rem;background:#0007;border:.08rem dashed #ffffff33;position:relative}
.sl.f{background:linear-gradient(#fffdf4,#efe2c2);border:.06rem solid #fff;border-bottom:.25rem solid #a98b52}.sl.f.pop{animation:pop .26s forwards}@keyframes pop{50%{transform:scale(1.2)}to{transform:scale(0);opacity:0}}
.sl .i{position:absolute;inset:10%}
.stagewrap{flex:1;display:flex;align-items:center;justify-content:center}
.bd{position:relative;height:31rem}
.tl{position:absolute;padding:0;border-radius:11%;background:linear-gradient(#fffdf4,#efe2c2);border:.06rem solid #fff;border-bottom:.3rem solid #a98b52;box-shadow:0 .25rem .35rem #0007;transition:filter .15s}
.tl .i{position:absolute;inset:13% 11% 15%}.tl svg,.sl svg,.pi svg{width:100%;height:100%;display:block}
.tl.dim{filter:brightness(.55) saturate(.7)}.tl.gone{display:none}.tl.hint{animation:hint .5s infinite alternate;z-index:999!important}@keyframes hint{to{transform:translateY(-.5rem) scale(1.1);filter:drop-shadow(0 0 .6rem var(--hi))}}
.boost{width:5rem;display:flex;flex-direction:column;justify-content:center;gap:1.1rem;align-items:center}
.bst{position:relative;width:4.4rem;height:4.4rem;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8ff0d6,#13917f);border:.2rem solid #d8fff4;box-shadow:0 .3rem 0 #0a5b50;display:grid;place-items:center}
.bst svg{width:2.2rem;height:2.2rem;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.bst b{position:absolute;bottom:-.3rem;right:-.3rem;min-width:1.6rem;padding:0 .3rem;border-radius:99px;background:#ff5a5f;border:.12rem solid #fff;font-size:.9rem;text-align:center}
#city{flex-direction:column;padding:.8rem 1.4rem;gap:.4rem}
.ctop{display:flex;align-items:center;gap:.6rem;height:3.2rem;padding-left:15rem}
.ctab{padding:.3rem .8rem;border-radius:.8rem;font-size:1rem;font-weight:800;color:#2b1706;background:#ffffffb0;border:.1rem solid #ffffff}.ctab.a{background:linear-gradient(#fff0a0,var(--gold));border-color:#fff6c0}
.cmid{flex:1;min-height:0;position:relative}.cmid svg{width:100%;height:100%}
.cinfo{position:absolute;right:.4rem;top:.2rem;display:flex;flex-direction:column;gap:.4rem;font-size:1rem}.cinfo .pill{color:var(--hi)}
.pal{height:11rem;border-radius:1.2rem 1.2rem 0 0;background:#140d33ee;border:.15rem solid var(--gold);padding:.4rem .8rem;display:flex;flex-direction:column;gap:.3rem}
.cats{display:flex;gap:.4rem;overflow-x:auto}.cats button{padding:.2rem .8rem;border-radius:99px;font-size:1rem;white-space:nowrap;background:#ffffff1c}.cats .a{background:var(--gold);color:var(--ink)}
.items{display:flex;gap:.6rem;overflow-x:auto;flex:1;padding-bottom:.2rem}
.it{flex:0 0 7.2rem;border-radius:.9rem;background:linear-gradient(#2a1b6b,#1a1245);border:.12rem solid #ffffff30;display:flex;flex-direction:column;align-items:center;padding:.2rem;font-size:.95rem}.it.a{border-color:var(--hi);box-shadow:0 0 .8rem var(--gold)}.it .pi{height:5.2rem;width:100%}.it .pr{display:flex;align-items:center;gap:.25rem;color:var(--hi);font-weight:800}
#shop{flex-direction:column;gap:.8rem;padding-top:3.6rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;overflow:auto}
.cd{display:flex;flex-direction:column;align-items:center;gap:.3rem;padding:.8rem;border-radius:1.1rem;background:#0c0824c4;border:.12rem solid #ffffff30;text-align:center;font-size:1rem}.cd b{color:var(--hi);font-size:1.2rem}
.bk{position:absolute;top:.8rem;right:1.2rem;z-index:21}
.modal{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:#0a0620e6}.modal.show{display:flex}
.dlg{width:26rem;text-align:center;padding:1.4rem;border-radius:1.6rem;color:var(--ink);background:linear-gradient(160deg,#fff3cf,#e3a948);border:.25rem solid #fff0a0;box-shadow:0 1rem 3rem #000a}.dlg h2{font-family:"Reem Kufi";font-size:2rem;margin:.2rem}.dlg p{line-height:1.6;margin:0 0 .8rem;font-size:1.1rem}.dlg .st{font-size:2.2rem;color:#c27d12;letter-spacing:.3rem}.dlg .btn{margin:.2rem;font-size:1.2rem;padding:.5rem 1.2rem}
.toast{position:absolute;top:1rem;left:50%;transform:translate(-50%,-1rem);opacity:0;pointer-events:none;z-index:60;padding:.5rem 1.2rem;border-radius:99px;background:#0c0824;border:.1rem solid var(--gold);font-weight:800;font-size:1.1rem;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
.float{position:absolute;left:50%;top:38%;z-index:40;pointer-events:none;font-family:"Reem Kufi";font-size:3rem;color:#fff6c0;text-shadow:0 .2rem 0 #a8480f,0 0 1.4rem #ffb020;animation:ff .9s forwards}@keyframes ff{0%{opacity:0;transform:translate(-50%,.6rem) scale(.4)}25%{opacity:1;transform:translate(-50%,0) scale(1.2)}100%{opacity:0;transform:translate(-50%,-4rem)}}
</style>
</head>
<body>
<div id="stage" data-s="splash">
<svg width="0" height="0" style="position:absolute" id="defs"></svg>
<svg id="bg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f0a2e"/><stop offset=".5" stop-color="#4a2a8a"/><stop offset=".8" stop-color="#c04a7a"/><stop offset="1" stop-color="#f08a3c"/></linearGradient></defs><rect width="800" height="400" fill="url(#sk)"/><g id="stars"></g><circle cx="620" cy="250" r="46" fill="#ffd27a" opacity=".9"/><path d="M0 400V300l90-30 90 30 60-40 70 60 70-70 90 80 90-60 80 50 60-30 100 40V400z" fill="#2a0f3f" opacity=".7"/><path d="M80 400 200 250l120 150zM300 400 440 230l140 170zM520 400l100-120 100 120z" fill="#190a30"/><path d="M0 400v-40l120 10 120-14 140 16 160-12 140 14 120-8v34z" fill="#0d0620"/></svg>
<div id="hud"><div class="pill"><svg class="ic"><use href="#coin"/></svg><span id="coins"></span></div><div class="pill" style="color:#ff8aa0">♥ <span id="lives"></span></div></div>

<section id="splash" class="sc on">
 <svg width="110" height="110" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#1b1250" stroke="url(#gold)" stroke-width="4"/><path d="M50 18 82 78H18z" fill="url(#gold)"/><circle cx="50" cy="56" r="7" fill="#ff6b7a" stroke="#fff6" stroke-width="2"/></svg>
 <div class="logo" style="font-size:5.6rem">ذهب مروي</div><div class="en">AURUM MEROË</div>
 <div class="bar"><i id="ld"></i></div><div id="ldt" style="margin-top:.6rem;font-size:1.1rem">جارٍ التحميل...</div>
</section>

<section id="menu" class="sc">
 <div class="prof"><div class="av">م</div><b>حارس مروي</b><div style="color:#c9b8ff;margin:.2rem 0">المرحلة <span id="hl"></span></div><div>بنيت <span id="nb">0</span> مبنى</div></div>
 <div class="mid"><div class="logo">ذهب مروي</div><div class="en">AURUM MEROË</div>
  <button class="btn" id="play" style="font-size:2.2rem;padding:.8rem 3.6rem">ابدأ اللعب</button>
  <div class="row"><button class="btn t" onclick="openCity()">مدينتي <span class="badge" id="pb" style="display:none"></span></button><button class="btn p" onclick="openShop()">المتجر</button></div></div>
 <div class="side"><button class="btn s g" onclick="daily()">الكنز اليومي</button><button class="btn s g" onclick="sett()">الإعدادات</button></div>
</section>

<section id="game" class="sc">
 <div class="boost">
  <button class="bst" onclick="boost('hint')"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10c1 1 1 2 1 3h6c0-1 0-2 1-3a6 6 0 0 0-4-10z"/></svg><b id="b_hint"></b></button>
  <button class="bst" onclick="boost('undo')"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg><b id="b_undo"></b></button>
  <button class="bst" onclick="boost('shuf')"><svg viewBox="0 0 24 24"><path d="M3 7h4l10 10h4M3 17h4l3-3M14 10l3-3h4M18 4l3 3-3 3M18 14l3 3-3 3"/></svg><b id="b_shuf"></b></button>
 </div>
 <div class="stagewrap"><div class="bd" id="bd"></div></div>
 <div class="tray" id="tray"></div>
 <div class="info"><div class="box"><span id="gt"></span></div><div class="box">المتبقي<b id="rem"></b></div><div class="combo" id="cmb">كومبو<b id="cn">×0</b></div><button class="btn s g" onclick="quit()" style="margin-top:auto">خروج</button></div>
</section>

<section id="city" class="sc">
 <button class="btn s g bk" onclick="show('menu')">رجوع</button>
 <div class="ctop" id="ctabs"></div>
 <div class="cmid"><svg id="cv" viewBox="0 0 600 330"></svg><div class="cinfo"><button class="btn s t" id="col" onclick="collect()"></button><div class="pill">قيمة <span id="cval"></span></div><div class="pill">سكان <span id="cpop"></span></div><div class="pill">+<span id="crate"></span>/د</div></div></div>
 <div class="pal"><div class="cats" id="cats"></div><div class="items" id="items"></div></div>
</section>

<section id="shop" class="sc"><button class="btn s g bk" onclick="show('menu')">رجوع</button><div class="logo" style="font-size:2.6rem;text-align:center">سوق مروي</div><div class="grid" id="shopL"></div></section>

<div class="modal" id="modal"><div class="dlg"><div class="st" id="mS"></div><h2 id="mT"></h2><p id="mP"></p><button class="btn" id="mB1"></button><button class="btn g" id="mB2" style="color:var(--ink);border-color:#a8670f"></button></div></div>
<div class="toast" id="toast"></div>
</div>
<script>
"use strict";
const $=i=>document.getElementById(i),sleep=ms=>new Promise(r=>setTimeout(r,ms)),ST=$("stage");
function fit(){document.documentElement.style.fontSize=ST.clientHeight/36+"px";ST.style.fontSize=ST.clientHeight/36+"px";}
addEventListener("resize",fit);fit();
let sx="";for(let i=0;i<70;i++)sx+=`<circle cx='${Math.random()*800}' cy='${Math.random()*220}' r='${Math.random()*1.4+.4}' fill='#fff' opacity='${Math.random()*.7+.2}'/>`;$("stars").innerHTML=sx;

const GEMS=[["#ff8a98","#a8112c","d:M50 92C8 62 4 34 22 17c13-11 23-4 28 7 5-11 15-18 28-7 18 17 14 45-28 75z"],["#7db3ff","#1b3fae","30,8 70,8 94,32 94,68 70,92 30,92 6,68 6,32"],["#79f5b0","#0b7a49","50,5 90,27 90,73 50,95 10,73 10,27"],["#dca4ff","#6a1fb0","50,3 63,35 97,38 71,60 80,94 50,76 20,94 29,60 3,38 37,35"],["#ffdc78","#c9600a","r"],["#86f6ea","#0f8a93","o"]];
let d="<defs><linearGradient id='gold' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#fff0a0'/><stop offset='.55' stop-color='#f2b632'/><stop offset='1' stop-color='#a8680d'/></linearGradient><radialGradient id='gl' cx='.35' cy='.25' r='.9'><stop offset='0' stop-color='#fff' stop-opacity='.35'/><stop offset='.6' stop-color='#fff' stop-opacity='0'/><stop offset='1' stop-color='#000' stop-opacity='.35'/></radialGradient><symbol id='coin' viewBox='0 0 24 24'><circle cx='12' cy='12' r='11' fill='url(#gold)' stroke='#8a5208' stroke-width='1.2'/><circle cx='12' cy='12' r='8' fill='none' stroke='#fff3b0' opacity='.8'/><path d='M12 6.5 17 16H7z' fill='#b8760f'/></symbol>";
GEMS.forEach((m,i)=>d+=`<linearGradient id='g${i}' x1='.2' y1='0' x2='.8' y2='1'><stop offset='0' stop-color='${m[0]}'/><stop offset='1' stop-color='${m[1]}'/></linearGradient>`);
$("defs").innerHTML=d+"</defs>";
function sh(i,f,tr){const p=GEMS[i][2],t=tr?` transform='${tr}'`:"";return p==="r"?`<rect x='12' y='12' width='76' height='76' rx='18' ${f}${t}/>`:p==="o"?`<circle cx='50' cy='50' r='44' ${f}${t}/>`:p[0]==="d"?`<path d='${p.slice(2)}' ${f}${t}/>`:`<polygon points='${p}' ${f}${t}/>`;}
const EX=["<polygon points='50,8 94,88 6,88' fill='url(#gold)' stroke='#8a5208' stroke-width='4' stroke-linejoin='round'/><polygon points='50,8 50,88 6,88' fill='#000' opacity='.18'/><circle cx='50' cy='62' r='7' fill='#ff6b7a'/>","<g fill='none' stroke='#e9a521' stroke-width='11' stroke-linecap='round'><ellipse cx='50' cy='30' rx='16' ry='20'/><path d='M50 50v42M24 62h52'/></g><ellipse cx='42' cy='24' rx='5' ry='9' fill='#fff' opacity='.5'/>","<circle cx='50' cy='50' r='22' fill='url(#gold)' stroke='#8a5208' stroke-width='3'/><g stroke='#e9a521' stroke-width='6' stroke-linecap='round'><path d='M50 8v14M50 78v14M8 50h14M78 50h14M20 20l10 10M70 70l10 10M80 20L70 30M30 70L20 80'/></g><circle cx='50' cy='50' r='9' fill='#fff' opacity='.7'/>"];
function art(i){if(i>=6)return EX[i-6];return sh(i,`fill='url(#g${i})' stroke='#fff' stroke-opacity='.75' stroke-width='3' stroke-linejoin='round'`)+sh(i,"fill='#fff' fill-opacity='.16' stroke='#fff' stroke-opacity='.55' stroke-width='1.5'","translate(50 50) scale(.56) translate(-50 -50)")+sh(i,"fill='url(#gl)'")+"<ellipse cx='36' cy='28' rx='15' ry='7' fill='#fff' opacity='.55' transform='rotate(-30 36 28)'/>";}
const svg=i=>`<svg viewBox='0 0 100 100'>${art(i)}</svg>`;
[[6,12,0],[24,70,1.5],[76,16,.8],[88,64,2.2],[48,82,3]].forEach(([x,y,dl],k)=>{const e=document.createElement("div");e.className="gem";e.style.cssText=`left:${x}%;top:${y}%;animation-delay:${dl}s`;e.innerHTML=svg(k);$("menu").appendChild(e);});

/* ===== buildings (isometric) ===== */
function box(w,h,c,o={}){const a=36*w,b=18*w;let s=`<polygon points='${-a},0 0,${b} 0,${b-h} ${-a},${-h}' fill='${c[1]}'/><polygon points='0,${b} ${a},0 ${a},${-h} 0,${b-h}' fill='${c[2]}'/>`;
 if(o.win){const R=Math.max(1,o.win);for(let r=0;r<R;r++)for(const u of[[.18,.4],[.6,.82]]){const v0=(r+.25)/R*.82+.08,v1=(r+.7)/R*.82+.08,L=(x,y)=>`${-a+x*a},${x*b-y*h}`,Rr=(x,y)=>`${x*a},${b-x*b-y*h}`;s+=`<polygon points='${L(u[0],v0)} ${L(u[1],v0)} ${L(u[1],v1)} ${L(u[0],v1)}' fill='#ffe7a0' opacity='.9'/><polygon points='${Rr(u[0],v0)} ${Rr(u[1],v0)} ${Rr(u[1],v1)} ${Rr(u[0],v1)}' fill='#ffd36a' opacity='.8'/>`;}}
 if(o.roof)s+=`<polygon points='${-a},${-h} 0,${b-h} 0,${-h-o.rh}' fill='${o.roof[0]}'/><polygon points='0,${b-h} ${a},${-h} 0,${-h-o.rh}' fill='${o.roof[1]}'/>`;
 else s+=`<polygon points='0,${-b-h} ${a},${-h} 0,${b-h} ${-a},${-h}' fill='${c[0]}'/>`;return s;}
const Y=["#ffd24a","#e0a517","#b9840f"],SD=["#f3dfb0","#d9b878","#b8914f"],WH=["#ffffff","#e4ecf5","#c4d0e0"],DM="<polygon points='0,-17 34,0 0,17 -34,0'";
function draw(t){switch(t.k){
 case"box":return box(t.w,t.h,t.col,t);
 case"fac":return box(.85,28,["#c9c3d9","#9d96b8","#7c7598"],{win:1})+`<g transform='translate(20,-8)'>${box(.2,60,["#8a5429","#6e4120","#55311a"])}</g><circle cx='22' cy='-80' r='6' fill='#fff' opacity='.5'/><circle cx='28' cy='-90' r='8' fill='#fff' opacity='.3'/>`;
 case"hos":return box(.85,42,WH,{win:2})+"<g fill='#e53935' transform='translate(0,-52)'><rect x='-9' y='-3' width='18' height='6' rx='2'/><rect x='-3' y='-9' width='6' height='18' rx='2'/></g>";
 case"fou":return"<ellipse cx='0' cy='4' rx='26' ry='13' fill='#e9c987'/><ellipse cx='0' cy='2' rx='22' ry='10.5' fill='#7fd0ff'/><path d='M0 2V-22M0-22c-8 4-12 10-12 18M0-22c8 4 12 10 12 18' stroke='#d8f3ff' stroke-width='3' fill='none' stroke-linecap='round'/>";
 case"pyr":return"<polygon points='-34,0 0,17 0,-64' fill='#e3b45e'/><polygon points='0,17 34,0 0,-64' fill='#b8843a'/><path d='M-26 -3 0 -22M-18 -9 0 -26M-10 -14 0 -30' stroke='#0003' fill='none'/><polygon points='0,-64 -5,-53 5,-53' fill='#ffe07a'/>";
 case"tem":return box(.9,12,SD)+[-20,-7,7,20].map(x=>`<rect x='${x-3}' y='-44' width='6' height='32' fill='#fff1cf' stroke='#d9b878' stroke-width='.8'/>`).join("")+`<g transform='translate(0,-44)'>${box(.8,8,SD)}</g><path d='M-14,-52a14,14 0 0 1 28,0z' fill='url(#gold)'/><circle cx='0' cy='-60' r='3' fill='#fff'/>`;
 case"palm":return"<path d='M0,0C2,-14 -2,-28 2,-44' stroke='#8a5429' stroke-width='5' fill='none' stroke-linecap='round'/><g stroke='#2fbf6a' stroke-width='5' stroke-linecap='round' fill='none'><path d='M2,-44q-16,-4 -26,6M2,-44q-10,-12 -22,-10M2,-44q16,-4 26,6M2,-44q10,-12 22,-10M2,-44v-20'/></g>";
 case"tree":return"<ellipse cx='0' cy='2' rx='14' ry='6' fill='#0003'/><rect x='-3' y='-20' width='6' height='20' fill='#6b3f1d'/><circle cx='0' cy='-32' r='15' fill='#2f9e57'/><circle cx='-9' cy='-24' r='10' fill='#3fbf6a'/><circle cx='9' cy='-25' r='10' fill='#34ad5f'/>";
 case"park":return DM+" fill='#58c46d'/><circle cx='-12' cy='-2' r='3' fill='#ff7a9a'/><circle cx='8' cy='-5' r='3' fill='#ffd84a'/><circle cx='14' cy='5' r='3' fill='#fff'/><circle cx='-4' cy='7' r='3' fill='#c77dff'/><circle cx='0' cy='-8' r='7' fill='#2f9e57'/>";
 case"lake":return DM+" fill='#3da5e0'/><path d='M-14 0q4-3 8 0M4 4q4-3 8 0M-2 -7q4-3 8 0' stroke='#cdeeff' fill='none' stroke-width='2'/>";
 case"road":return DM+" fill='#4a4560'/><path d='M-17,-8.5L17,8.5' stroke='#f2d37a' stroke-width='2' stroke-dasharray='5 4'/>";
 case"cra":return box(.3,74,Y)+"<path d='M0,-74L42,-62M0,-74L-26,-66' stroke='#e0a517' stroke-width='5' stroke-linecap='round'/><path d='M42,-62V-34' stroke='#444' stroke-width='2'/><rect x='37' y='-34' width='10' height='6' fill='#888'/>";
 case"doz":return"<ellipse cx='-12' cy='4' rx='6' ry='6' fill='#222'/><ellipse cx='14' cy='-2' rx='6' ry='6' fill='#222'/>"+box(.45,12,Y)+`<g transform='translate(-3,-12)'>${box(.22,12,Y)}</g><path d='M-24,-4L-34,6' stroke='#777' stroke-width='5'/>`;
 case"tank":return"<ellipse cx='0' cy='0' rx='14' ry='7' fill='#8fa7c4'/><rect x='-14' y='-44' width='28' height='44' fill='#8fa7c4'/><ellipse cx='0' cy='-44' rx='14' ry='7' fill='#b8cbe0'/>";
 case"lamp":return"<rect x='-1.5' y='-50' width='3' height='50' fill='#555'/><circle cx='0' cy='-54' r='9' fill='#fff2a8' opacity='.6'/><circle cx='0' cy='-54' r='4' fill='#fff'/>";}return"";}
const IT=[
{n:"بيت طيني",c:0,$:80,inc:2,pop:3,k:"box",w:.62,h:26,col:["#d9a066","#b87a45","#955e33"],roof:["#9a4b2a","#7d3a1f"],rh:16,win:1},
{n:"فيلا",c:0,$:220,inc:5,pop:6,k:"box",w:.72,h:34,col:["#fff3dd","#efd9b5","#d4b88c"],roof:["#d2572d","#a9421f"],rh:20,win:1},
{n:"برج سكني",c:0,$:600,inc:14,pop:20,k:"box",w:.6,h:92,col:["#cfe3ff","#8fb3e8","#6b8fc9"],win:5},
{n:"دكان",c:1,$:150,inc:4,pop:0,k:"box",w:.7,h:28,col:["#ffe08a","#f2b632","#c98f1b"],roof:["#c0392b","#962d22"],rh:8,win:1},
{n:"سوق",c:1,$:450,inc:11,pop:0,k:"box",w:.88,h:30,col:["#ffd1d1","#e57d7d","#bf5c5c"],roof:["#26307a","#1b2459"],rh:12,win:1},
{n:"مصنع",c:1,$:900,inc:22,pop:0,k:"fac"},
{n:"مدرسة",c:2,$:350,inc:8,pop:0,k:"box",w:.88,h:36,col:["#fff","#ffdf7e","#e0b84d"],roof:["#2f9e57","#237a43"],rh:14,win:2},
{n:"مستشفى",c:2,$:700,inc:16,pop:0,k:"hos"},{n:"نافورة",c:2,$:200,inc:3,pop:0,k:"fou"},
{n:"هرم مروي",c:3,$:1500,inc:30,pop:0,k:"pyr"},{n:"معبد الشمس",c:3,$:2200,inc:45,pop:0,k:"tem"},
{n:"نخلة",c:4,$:40,inc:1,pop:0,k:"palm"},{n:"شجرة",c:4,$:30,inc:1,pop:0,k:"tree"},{n:"حديقة",c:4,$:90,inc:2,pop:0,k:"park"},{n:"بحيرة",c:4,$:120,inc:2,pop:0,k:"lake"},
{n:"رافعة",c:5,$:300,inc:6,pop:0,k:"cra"},{n:"جرافة",c:5,$:180,inc:4,pop:0,k:"doz"},{n:"خزان ماء",c:5,$:140,inc:3,pop:0,k:"tank"},{n:"عمود إنارة",c:5,$:60,inc:1,pop:0,k:"lamp"},
{n:"طريق",c:6,$:20,inc:0,pop:0,k:"road"}];
const CATS=["بيوت","تجارة","مرافق","معالم","طبيعة","معدات","طرق"];
const CITY=[{n:"واحة مروي",$:0,gr:["#8ccf7a","#7bc16a"],sd:["#6d9e55","#55803f"]},{n:"ميناء النيل",$:3000,gr:["#e9d8a6","#dccb96"],sd:["#b29d62","#98844e"]},{n:"قلعة الصحراء",$:8000,gr:["#f0b66b","#e5a75a"],sd:["#b9783a","#9a6130"]}];

/* ===== save ===== */
const def={lvl:1,coins:600,lives:5,lt:Date.now(),b:{hint:2,undo:2,shuf:1},daily:"",sound:true,dbl:0,cities:[{g:Array(36).fill(-1),t:Date.now(),on:true},{g:Array(36).fill(-1),t:Date.now(),on:false},{g:Array(36).fill(-1),t:Date.now(),on:false}]};
let S=JSON.parse(JSON.stringify(def));try{const o=JSON.parse(localStorage.getItem("aurumCity"));if(o)S={...S,...o,b:{...S.b,...(o.b||{})}};}catch(e){}
function regen(){if(S.lives<5){const n=Math.floor((Date.now()-S.lt)/480000);if(n>0){S.lives=Math.min(5,S.lives+n);S.lt=Date.now();}}else S.lt=Date.now();}
function save(){try{localStorage.setItem("aurumCity",JSON.stringify(S));}catch(e){}wal();}
function nBuilt(){return S.cities.reduce((a,c)=>a+c.g.filter(v=>v>=0).length,0);}
function wal(){regen();$("coins").textContent=S.coins;$("lives").textContent=S.lives;$("hl").textContent=S.lvl;$("nb").textContent=nBuilt();["hint","undo","shuf"].forEach(k=>$("b_"+k).textContent=S.b[k]>0?S.b[k]:"+");const p=pendAll();$("pb").style.display=p>0?"":"none";$("pb").textContent="+"+p;}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2000);}
let ac;function beep(f,t=.1){if(!S.sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type="triangle";o.frequency.value=f;g.gain.value=.07;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+t);}catch(e){}}
function modal(t,p,b1,c1,b2,c2,st){$("mS").textContent=st||"";$("mT").textContent=t;$("mP").textContent=p;const a=$("mB1"),b=$("mB2");a.textContent=b1;a.onclick=()=>{$("modal").classList.remove("show");c1&&c1();};b.style.display=b2?"":"none";if(b2){b.textContent=b2;b.onclick=()=>{$("modal").classList.remove("show");c2&&c2();};}$("modal").classList.add("show");}
function show(n){document.querySelectorAll(".sc").forEach(s=>s.classList.remove("on"));$(n).classList.add("on");ST.dataset.s=n;wal();}
function say(t){const e=document.createElement("div");e.className="float";e.textContent=t;ST.appendChild(e);setTimeout(()=>e.remove(),950);}

/* ===== splash ===== */
let ldv=0;const ldi=setInterval(()=>{ldv+=2+Math.random()*3;$("ld").style.width=Math.min(100,ldv)+"%";if(ldv>=100){clearInterval(ldi);$("ldt").textContent="المس الشاشة للبدء";$("ldt").className="blink";$("splash").onclick=()=>{try{(document.documentElement.requestFullscreen?document.documentElement.requestFullscreen():Promise.reject()).then(()=>screen.orientation.lock("landscape")).catch(()=>{});}catch(e){}beep(500,.15);show("menu");$("splash").onclick=null;};}},60);

/* ===== tile game ===== */
let tiles=[],tray=[],hist=[],lvl=1,busy=false,active=false,combo=0,lastM=0,cols=4;
const free=t=>!tiles.some(u=>u.a&&u.z>t.z&&Math.abs(u.x-t.x)<2&&Math.abs(u.y-t.y)<2);
function start(n){
 if(S.lives<=0){modal("انتهت المحاولات","اشترِ حياة من المتجر بالعملات الذهبية.","المتجر",openShop);return;}
 lvl=n;cols=Math.min(6,4+Math.floor(n/6));const layers=Math.min(3,2+Math.floor(n/3)),types=Math.min(9,5+Math.floor(n/2));
 tiles=[];for(let z=0;z<layers;z++)for(let i=0;i<cols-z;i++)for(let j=0;j<cols-z;j++)tiles.push({x:z+2*i,y:z+2*j,z,a:true});
 while(tiles.length%3)tiles.pop();
 const ic=[];for(let k=0;k<tiles.length/3;k++){const t=Math.floor(Math.random()*types);ic.push(t,t,t);}
 for(let i=ic.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ic[i],ic[j]]=[ic[j],ic[i]];}
 tiles.forEach((t,i)=>t.i=ic[i]);tray=[];hist=[];busy=false;active=true;combo=0;
 const bd=$("bd");bd.innerHTML="";bd.style.aspectRatio=`${2*cols}/${2*cols*1.12}`;
 tiles.forEach(t=>{const e=document.createElement("button");e.className="tl";e.style.cssText=`left:${t.x/(2*cols)*100}%;top:${t.y/(2*cols)*100}%;width:${100/cols}%;height:${100/cols}%;z-index:${t.z*100+t.y}`;e.innerHTML=`<div class='i'>${svg(t.i)}</div>`;e.onclick=()=>tap(t);t.el=e;bd.appendChild(e);});
 $("gt").textContent="المرحلة "+lvl;show("game");upd();drawTray();}
function upd(){tiles.forEach(t=>t.a&&t.el.classList.toggle("dim",!free(t)));$("rem").textContent=tiles.filter(t=>t.a).length+tray.length;$("cn").textContent="×"+combo;$("cmb").classList.toggle("on",combo>1);}
function drawTray(pop){const t=$("tray");t.innerHTML="";for(let k=0;k<7;k++){const s=document.createElement("div"),x=tray[k];s.className="sl"+(x?" f":"")+(x&&pop&&pop.includes(x)?" pop":"");if(x)s.innerHTML=`<div class='i'>${svg(x.i)}</div>`;t.appendChild(s);}}
async function tap(t){if(!active||busy||!t.a||!free(t))return;
 t.a=false;t.el.classList.add("gone");hist.push(t);beep(520,.06);
 let at=tray.length;for(let k=tray.length-1;k>=0;k--)if(tray[k].i===t.i){at=k+1;break;}tray.splice(at,0,t);drawTray();upd();
 const same=tray.filter(x=>x.i===t.i);
 if(same.length>=3){busy=true;await sleep(180);drawTray(same);await sleep(260);if(!active)return;
  tray=tray.filter(x=>x.i!==t.i);hist=hist.filter(x=>!same.includes(x));
  const now=Date.now();combo=now-lastM<5000?combo+1:1;lastM=now;const g=(4+combo*2)*(S.dbl>0?2:1);S.coins+=g;beep(660+combo*60,.2);say(combo>1?`كومبو ×${combo}`:`+${g}`);
  drawTray();upd();save();busy=false;
  if(tiles.every(x=>!x.a)&&!tray.length)win();return;}
 if(tray.length>=7){active=false;await sleep(300);full();}}
setInterval(()=>{if(active&&combo&&Date.now()-lastM>5000){combo=0;upd();}},500);
function win(){active=false;const rw=(60+lvl*5)*(S.dbl>0?2:1);S.coins+=rw;if(S.dbl>0)S.dbl--;S.lvl=Math.max(S.lvl,lvl+1);save();beep(780,.4);modal("انتصار!",`حصلت على ${rw} عملة ذهبية. ابنِ بها مدينتك!`,"المرحلة التالية",()=>start(S.lvl),"مدينتي",openCity,"★★★");}
function full(){modal("الصينية ممتلئة!","أرجع وأفرغ الصينية بـ 300 عملة ذهبية، أو أعد المرحلة بخسارة حياة.","ارجع · 300",()=>{if(S.coins<300){toast("عملاتك الذهبية لا تكفي");lose();return;}S.coins-=300;tray.forEach(t=>{t.a=true;t.el.classList.remove("gone");});tray=[];hist=[];active=true;busy=false;save();drawTray();upd();},"أعد المرحلة",lose);}
function lose(){S.lives=Math.max(0,S.lives-1);save();start(lvl);}
function quit(){modal("الخروج؟","لن يُحفظ تقدم هذه المرحلة.","نعم",()=>{active=false;show("menu");},"ابقَ",()=>{});}
const COST={hint:60,undo:80,shuf:100};
function boost(k){if(!active||busy)return;if(S.b[k]>0)S.b[k]--;else if(S.coins>=COST[k])S.coins-=COST[k];else{toast(`تحتاج ${COST[k]} عملة ذهبية`);return;}
 if(k==="undo"){const t=hist.pop();if(!t){toast("لا توجد حركة للتراجع");S.b[k]++;wal();return;}tray=tray.filter(x=>x!==t);t.a=true;t.el.classList.remove("gone");drawTray();}
 if(k==="shuf"){const al=tiles.filter(t=>t.a),ic=al.map(t=>t.i);for(let i=ic.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ic[i],ic[j]]=[ic[j],ic[i]];}al.forEach((t,i)=>{t.i=ic[i];t.el.firstChild.innerHTML=svg(t.i);});say("خلط!");}
 if(k==="hint"){const fr=tiles.filter(t=>t.a&&free(t));let ic=(tray[0]&&fr.some(t=>t.i===tray[0].i))?tray[0].i:null;if(ic===null){const m={};fr.forEach(t=>m[t.i]=(m[t.i]||0)+1);ic=+Object.keys(m).sort((a,b)=>m[b]-m[a])[0];}fr.filter(t=>t.i===ic).slice(0,3).forEach(t=>{t.el.classList.add("hint");setTimeout(()=>t.el.classList.remove("hint"),1600);});}
 upd();save();}

/* ===== city ===== */
let cur=0,sel=-1,pcat=0;
const rate=c=>c.g.reduce((a,v)=>a+(v>=0?IT[v].inc:0),0);
const pend=c=>Math.floor(rate(c)*Math.min(120,(Date.now()-c.t)/60000));
const pendAll=()=>S.cities.reduce((a,c)=>a+(c.on?pend(c):0),0);
function openCity(){show("city");renderCity();}
function renderCity(){const c=S.cities[cur],K=CITY[cur];
 $("ctabs").innerHTML=CITY.map((t,i)=>`<button class="ctab ${i===cur?"a":""}" onclick="pickCity(${i})">${t.n}${S.cities[i].on?"":" · "+t.$}</button>`).join("");
 let s="";for(let sum=0;sum<=10;sum++)for(let i=0;i<6;i++){const j=sum-i;if(j<0||j>5)continue;const x=300+(i-j)*36,y=70+(i+j)*18+18,v=c.g[i*6+j];
  s+=`<g transform='translate(${x},${y})' onclick='plot(${i*6+j})'><polygon points='0,-18 36,0 0,18 -36,0' fill='${K.gr[(i+j)%2]}'/><polygon points='-36,0 0,18 0,26 -36,8' fill='${K.sd[0]}'/><polygon points='0,18 36,0 36,8 0,26' fill='${K.sd[1]}'/>${v>=0?draw(IT[v]):""}</g>`;}
 $("cv").innerHTML=s;
 const val=c.g.reduce((a,v)=>a+(v>=0?Math.floor(IT[v].$/10):0),0),pop=c.g.reduce((a,v)=>a+(v>=0?IT[v].pop:0),0);$("cval").textContent=val;$("cpop").textContent=pop;$("crate").textContent=rate(c);
 $("cats").innerHTML=CATS.map((t,i)=>`<button class="${i===pcat?"a":""}" onclick="pcat=${i};renderCity()">${t}</button>`).join("");
 $("items").innerHTML=IT.map((t,i)=>t.c===pcat?`<button class="it ${i===sel?"a":""}" onclick="sel=${i};renderCity()"><div class="pi"><svg viewBox='-44 -100 88 125'>${draw(t)}</svg></div><b>${t.n}</b><span class="pr"><svg class="ic"><use href="#coin"/></svg>${t.$}</span></button>`:"").join("");
 colUpd();}
function colUpd(){const p=pend(S.cities[cur]);$("col").textContent=p>0?`اجمع +${p}`:"لا دخل بعد";}
setInterval(()=>{if(ST.dataset.s==="city")colUpd();else if(ST.dataset.s==="menu")wal();},4000);
function pickCity(i){const K=CITY[i];if(!S.cities[i].on){modal("فتح "+K.n,`افتح مدينة جديدة مقابل ${K.$} عملة ذهبية؟`,"افتح",()=>{if(S.coins<K.$){toast("عملاتك الذهبية لا تكفي");return;}S.coins-=K.$;S.cities[i].on=true;S.cities[i].t=Date.now();cur=i;save();renderCity();beep(700,.3);say("مدينة جديدة!");},"لاحقاً",()=>{});return;}cur=i;renderCity();}
function plot(k){const c=S.cities[cur],v=c.g[k];
 if(v>=0){const it=IT[v],rf=Math.floor(it.$/2);modal(it.n,`دخلها ${it.inc} عملة في الدقيقة. البيع يعيد ${rf} عملة ذهبية.`,"بيع +"+rf,()=>{c.g[k]=-1;S.coins+=rf;save();renderCity();},"إغلاق",()=>{});return;}
 if(sel<0){toast("اختر عنصراً من الأسفل أولاً");return;}const it=IT[sel];
 if(S.coins<it.$){toast(`تحتاج ${it.$} عملة ذهبية`);return;}
 S.coins-=it.$;c.g[k]=sel;save();renderCity();beep(600,.15);}
function collect(){const c=S.cities[cur],p=pend(c);if(p<=0){toast("ابنِ مبانٍ لتنتج الذهب");return;}S.coins+=p;c.t=Date.now();save();colUpd();say("+"+p);beep(800,.25);}

/* ===== shop & misc ===== */
const SH=[["3 تلميحات",150,()=>S.b.hint+=3],["3 تراجعات",200,()=>S.b.undo+=3],["خلطتان",150,()=>S.b.shuf+=2],["حياة إضافية",150,()=>{if(S.lives>=5)return toast("محاولاتك ممتلئة"),false;S.lives++;}],["ذهب مضاعف ×2",400,()=>S.dbl+=5],["حزمة بنّاء",500,()=>{const c=S.cities[0];c.t-=3600000;}]];
const SD2=["للمراحل","للمراحل","للمراحل","محاولة","لخمس مراحل","دخل ساعة كامل لواحة مروي"];
function openShop(){show("shop");$("shopL").innerHTML=SH.map((t,i)=>`<div class="cd"><b>${t[0]}</b><small style="color:#c9b8ff">${SD2[i]}</small><button class="btn s" onclick="buy(${i})"><svg class="ic"><use href="#coin"/></svg>${t[1]}</button></div>`).join("");}
function buy(i){const t=SH[i];if(S.coins<t[1]){toast("عملاتك الذهبية لا تكفي");return;}if(t[2]()===false)return;S.coins-=t[1];save();toast("تمت عملية الشراء");}
function daily(){const t=new Date().toDateString();if(S.daily===t){toast("استلمت كنز اليوم بالفعل");return;}S.daily=t;S.coins+=150;save();modal("الكنز اليومي","حصلت على 150 عملة ذهبية.","رائع");}
function sett(){modal("الإعدادات","الصوت: "+(S.sound?"مفعل":"مغلق"),S.sound?"أغلق الصوت":"فعّل الصوت",()=>{S.sound=!S.sound;save();},"إعادة التقدم",()=>modal("إعادة التقدم؟","سيتم حذف كل شيء.","نعم",()=>{try{localStorage.removeItem("aurumCity");}catch(e){}S=JSON.parse(JSON.stringify(def));save();},"لا",()=>{}));}
$("play").onclick=()=>start(S.lvl);wal();
</script>
